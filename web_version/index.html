<!doctype html>
<!-- Created: 2026-09-28T18:45:14+09:00 -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwritten Digit Recognition</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:linear-gradient(125deg,#667bbd,#70509a);color:#30333a;font-family:Arial,Helvetica,sans-serif}main{width:min(380px,100%);padding:28px 26px 24px;border-radius:14px;background:white;box-shadow:0 12px 36px #27204b33;text-align:center}h1{font-size:24px;line-height:1.3;margin:0 0 10px}.subtitle{color:#81838b;font-size:13px;margin:0 0 22px;line-height:1.5}#pad{display:block;width:280px;max-width:100%;height:auto;aspect-ratio:1;margin:auto;background:white;border-radius:8px;outline:2px solid #e5e5e8;box-shadow:0 1px 6px #0000000c;touch-action:none;cursor:crosshair}.buttons{display:flex;justify-content:center;gap:12px;margin:18px 0 22px}button{border:0;border-radius:5px;padding:12px 25px;font-size:12px;letter-spacing:.03em;font-weight:700;color:white;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible{outline:3px solid #292c66;outline-offset:4px}button:disabled{opacity:.6;cursor:wait}#clear{background:#f26556}#recognize{background:#54af68}.results{background:#f5f5f7;border-radius:7px;text-align:left;padding:16px}h2{font-size:16px;margin:0 0 12px}#status{font-size:13px;line-height:1.5;color:#777984;margin:12px 0 0}.prediction{display:flex;align-items:center;gap:14px;background:white;border-radius:5px;padding:12px;margin-top:9px;box-shadow:0 2px 4px #00000007}.number{width:22px;color:#6176b5;font-size:22px;font-weight:700;text-align:center}.track{position:relative;flex:1;height:21px;background:#e2e2e5;border-radius:14px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#667bc2,#7752a1);border-radius:inherit}.percent{position:absolute;right:8px;top:4px;font-size:11px;font-weight:bold;color:#434453}.track.high .percent{color:white}.note{color:#92939c;font-size:10px;line-height:1.5;margin:16px 0 0}@media(max-width:350px){main{padding:24px 18px}h1{font-size:22px}}
</style></head>
<body><main>
<h1>Handwritten Digit<br>Recognition</h1>
<p class="subtitle">Draw a digit (0-9) on the canvas below</p>
<canvas id="pad" width="280" height="280" aria-label="Draw one digit from zero to nine"></canvas>
<div class="buttons"><button id="clear" type="button">CLEAR</button><button id="recognize" type="button">PREDICT</button></div>
<section class="results" aria-labelledby="results-title"><h2 id="results-title">Predictions</h2><div id="bars"></div><p id="status" role="status" aria-live="polite">Draw a digit and click PREDICT.</p></section>
<p class="note">Top 3 nearest-neighbor vote shares, not confidence probabilities.<br>Runs locally on your computer.</p>
</main><script>
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d', {willReadFrequently: true});
const predictButton = document.getElementById('recognize');
const statusText = document.getElementById('status');
const bars = document.getElementById('bars');
let activePointer = null, hasInk = false, revision = 0;
function reset() {
  if (activePointer !== null && pad.hasPointerCapture(activePointer)) pad.releasePointerCapture(activePointer);
  activePointer = null; revision++; hasInk = false;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 280, 280);
  ctx.strokeStyle = '#000'; ctx.fillStyle = '#000'; ctx.lineWidth = 18;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; bars.replaceChildren();
  statusText.textContent = 'Draw a digit and click PREDICT.';
}
function point(event) {
  const box = pad.getBoundingClientRect();
  return [(event.clientX-box.left)*280/box.width, (event.clientY-box.top)*280/box.height];
}
pad.addEventListener('pointerdown', event => {
  if (activePointer !== null || event.button !== 0) return;
  event.preventDefault(); revision++; activePointer = event.pointerId; hasInk = true;
  bars.replaceChildren(); statusText.textContent = 'Click PREDICT when your digit is ready.';
  pad.setPointerCapture(event.pointerId);
  const [x,y] = point(event); ctx.beginPath(); ctx.arc(x,y,9,0,2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y);
});
pad.addEventListener('pointermove', event => {if(event.pointerId === activePointer){ctx.lineTo(...point(event));ctx.stroke();}});
for(const name of ['pointerup','pointercancel','lostpointercapture']) {
  pad.addEventListener(name, event => {if(event.pointerId === activePointer) activePointer=null;});
}
document.getElementById('clear').addEventListener('click', reset);
predictButton.addEventListener('click', async () => {
  if(!hasInk){statusText.textContent='Please draw a digit first.';return;}
  const requestRevision=revision;
  predictButton.disabled=true; predictButton.textContent='READING...';
  statusText.textContent='Recognizing your handwriting...';
  try {
    const rgba=ctx.getImageData(0,0,280,280).data;
    // Convert black ink on white paper to the white-on-black MNIST format.
    const pixels=Array.from({length:280},(_,y)=>Array.from({length:280},(_,x)=>255-rgba[(y*280+x)*4]));
    const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pixels}),signal:AbortSignal.timeout(20000)});
    const result=await response.json(); if(!response.ok) throw new Error(result.error || 'Recognition failed.');
    if(requestRevision !== revision) return;
    const ranked=result.scores.map((score,number)=>({score,number})).sort((a,b)=>b.score-a.score || a.number-b.number).slice(0,3);
    bars.replaceChildren();
    for(const {score,number} of ranked){
      const row=document.createElement('div'); row.className='prediction';
      row.setAttribute('aria-label',`Digit ${number}: ${(score*100).toFixed(1)} percent vote share`);
      row.innerHTML=`<span class="number">${number}</span><div class="track ${score>=.8?'high':''}"><div class="fill" style="width:${score*100}%"></div><span class="percent">${(score*100).toFixed(1)}%</span></div>`;
      bars.append(row);
    }
    statusText.textContent=`Recognized digit: ${result.digit}`;
  } catch(error){if(requestRevision===revision) statusText.textContent=error.name==='TimeoutError'?'Recognition timed out. Please try again.':error.message;}
  finally{predictButton.disabled=false;predictButton.textContent='PREDICT';}
});
reset();
</script></body></html>
